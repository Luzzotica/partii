openapi: 3.1.0
info:
  title: partii platform API
  version: 1.0.0
  description: |
    The one source of truth for partii's HTTP API. `api/gen.mjs` generates the
    edge's route table, the Rust client the CLI uses, the TypeScript client
    the web apps use, and docs/API.md. Every response is JSON:
    `{"ok":true,...}` or `{"ok":false,"error":{"code","message","hint"}}`.

    Auth (`x-auth`):
    - `public`: nothing.
    - `key`: a publishable key in `X-Partii-Key` (games and web pages).
    - `player`: `X-Partii-Key` plus `Authorization: Bearer <player token>`.
    - `developer`: `Authorization: Bearer <developer token>` (`PARTII_TOKEN`).
    - `admin`: `Authorization: Bearer <admin token>` (platform operators).
    - `stripe`: a Stripe-signed webhook.

    `x-cli` is the `partii` command that calls the operation.
servers:
  - url: http://127.0.0.1:8787
  - url: https://api.partii.games
  - url: https://api-staging.partii.games
  # The workers.dev hosts stay up for builds that already shipped with them.
  - url: https://partii-edge.partii-games.workers.dev
  - url: https://partii-edge-staging.partii-games.workers.dev

components:
  schemas:
    Error:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        hint: { type: string }
    Developer:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string }
        created_at: { type: integer }
    Token:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        created_at: { type: integer }
        token: { type: string, description: "Only in the create response." }
    Project:
      type: object
      properties:
        id: { type: string, pattern: "^[a-z0-9]{1,32}$" }
        name: { type: string }
        plan: { type: string, enum: [free, pro] }
        created_at: { type: integer }
    Key:
      type: object
      properties:
        project: { type: string }
        key_id: { type: string }
        name: { type: string }
        key: { type: string, description: "The publishable key (pk_...). Safe to ship in a client." }
        revoked_at: { type: [integer, "null"] }
    Game:
      type: object
      properties:
        id: { type: string, pattern: "^[a-z0-9-]{1,40}$" }
        project: { type: string }
        title: { type: string }
        tagline: { type: string }
        description: { type: string }
        price_cents: { type: integer }
        currency: { type: string }
        sale: { type: [object, "null"], properties: { percent: { type: integer }, starts_at: { type: integer }, ends_at: { type: integer } } }
        demo: { type: [object, "null"], description: "The demo gate, e.g. {\"free_levels\": 20}. Null means no free part." }
        platforms: { type: array, items: { type: string, enum: [macos, windows, linux, ios, android, web] } }
        store: { type: object, description: "Store page media and links: cover, screenshots, trailer, app store links." }
        status: { type: string, enum: [draft, published] }
        updated_at: { type: integer }
    Build:
      type: object
      properties:
        id: { type: string }
        game: { type: string }
        platform: { type: string }
        version: { type: string }
        channel: { type: string }
        size: { type: integer }
        sha256: { type: string }
        created_at: { type: integer }
    Player:
      type: object
      properties:
        id: { type: string }
        display_name: { type: string }
        providers: { type: array, items: { type: string } }
        test: { type: boolean }
        created_at: { type: integer }
    Entitlement:
      type: object
      properties:
        game: { type: string }
        sku: { type: string }
        source: { type: string, enum: [stripe, steam, appstore, play, grant, test, code] }
        ref: { type: string }
        created_at: { type: integer }
    Save:
      type: object
      properties:
        slot: { type: string }
        rev: { type: integer }
        size: { type: integer }
        updated_at: { type: integer }
        data: { description: "The save's JSON (on reads of one slot)." }
    ContentManifest:
      type: object
      properties:
        game: { type: string }
        channel: { type: string }
        version: { type: string }
        files: { type: object, additionalProperties: { type: object, properties: { sha256: { type: string }, size: { type: integer } } } }

paths:
  /health:
    get:
      operationId: health
      summary: Is the edge up?
      x-auth: public
      x-cli: status
      responses: { "200": { description: ok } }

  /v1/admin/developers:
    post:
      operationId: adminCreateDeveloper
      summary: Create a developer and their first token (platform operators).
      x-auth: admin
      x-cli: admin developers create
      requestBody: { content: { application/json: { schema: { type: object, required: [email], properties: { email: { type: string }, name: { type: string } } } } } }
      responses: { "200": { description: "{developer, token}" } }

  /v1/admin/usage:
    get:
      operationId: adminUsage
      summary: Live sessions and rooms, peaks, rate-limit hits and recent alerts, per project (platform operators).
      x-auth: admin
      x-cli: admin usage
      parameters:
        - { name: project, in: query, schema: { type: string } }
      responses: { "200": { description: "{projects}" } }

  /v1/me:
    get:
      operationId: me
      summary: The developer this token belongs to.
      x-auth: developer
      x-cli: whoami
      responses: { "200": { description: "{developer}" } }

  /v1/tokens:
    get:
      operationId: tokensList
      summary: Your developer tokens (without secrets).
      x-auth: developer
      x-cli: tokens list
      responses: { "200": { description: "{tokens}" } }
    post:
      operationId: tokensCreate
      summary: Make another developer token (shown once).
      x-auth: developer
      x-cli: tokens create
      requestBody: { content: { application/json: { schema: { type: object, properties: { name: { type: string } } } } } }
      responses: { "200": { description: "{token}" } }
  /v1/tokens/{token_id}:
    delete:
      operationId: tokensRevoke
      summary: Revoke a developer token.
      x-auth: developer
      x-cli: tokens revoke
      parameters: [{ name: token_id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: "{revoked}" } }

  /v1/projects:
    get:
      operationId: projectsList
      summary: Your projects.
      x-auth: developer
      x-cli: projects list
      responses: { "200": { description: "{projects}" } }
  /v1/projects/{project}:
    put:
      operationId: projectsPut
      summary: Create or update a project (idempotent on its id).
      x-auth: developer
      x-cli: projects put
      parameters: [{ name: project, in: path, required: true, schema: { type: string } }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { name: { type: string } } } } } }
      responses: { "200": { description: "{project}" } }
    get:
      operationId: projectsGet
      summary: One project.
      x-auth: developer
      x-cli: projects get
      parameters: [{ name: project, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: "{project}" } }

  /v1/projects/{project}/keys:
    get:
      operationId: keysList
      summary: A project's publishable keys.
      x-auth: developer
      x-cli: keys list
      parameters: [{ name: project, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: "{keys}" } }
    post:
      operationId: keysCreate
      summary: Make a publishable key (idempotent on key_id).
      x-auth: developer
      x-cli: keys create
      parameters: [{ name: project, in: path, required: true, schema: { type: string } }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { key_id: { type: string }, name: { type: string } } } } } }
      responses: { "200": { description: "{key}" } }
  /v1/projects/{project}/keys/{key_id}:
    delete:
      operationId: keysRevoke
      summary: Revoke a publishable key (clients using it are refused within a minute).
      x-auth: developer
      x-cli: keys revoke
      parameters:
        - { name: project, in: path, required: true, schema: { type: string } }
        - { name: key_id, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: "{revoked}" } }

  /v1/projects/{project}/timings:
    get:
      operationId: timingsList
      summary: Recent connection timings clients reported (create, join, connect, path).
      x-auth: developer
      x-cli: timings
      parameters:
        - { name: project, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer } }
      responses: { "200": { description: "{timings, summary}" } }

  /v1/games:
    get:
      operationId: gamesList
      summary: Your games.
      x-auth: developer
      x-cli: games list
      responses: { "200": { description: "{games}" } }
  /v1/games/{game}:
    put:
      operationId: gamesPut
      summary: Create or update a game's store page and settings (idempotent).
      x-auth: developer
      x-cli: games put
      parameters: [{ name: game, in: path, required: true, schema: { type: string } }]
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/Game" } } } }
      responses: { "200": { description: "{game}" } }
    get:
      operationId: gamesGet
      summary: One of your games (drafts too).
      x-auth: developer
      x-cli: games get
      parameters: [{ name: game, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: "{game}" } }
  /v1/games/{game}/publish:
    post:
      operationId: gamesPublish
      summary: Put the game on the store.
      x-auth: developer
      x-cli: games publish
      parameters: [{ name: game, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: "{game}" } }
  /v1/games/{game}/unpublish:
    post:
      operationId: gamesUnpublish
      summary: Take the game off the store (owners keep it).
      x-auth: developer
      x-cli: games unpublish
      parameters: [{ name: game, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: "{game}" } }
  /v1/games/{game}/price:
    put:
      operationId: gamesPrice
      summary: Set the price.
      x-auth: developer
      x-cli: games price
      parameters: [{ name: game, in: path, required: true, schema: { type: string } }]
      requestBody: { content: { application/json: { schema: { type: object, required: [price_cents], properties: { price_cents: { type: integer }, currency: { type: string } } } } } }
      responses: { "200": { description: "{game}" } }
  /v1/games/{game}/sale:
    put:
      operationId: gamesSale
      summary: Start a sale (percent off between two times).
      x-auth: developer
      x-cli: games sale
      parameters: [{ name: game, in: path, required: true, schema: { type: string } }]
      requestBody: { content: { application/json: { schema: { type: object, required: [percent], properties: { percent: { type: integer }, starts_at: { type: integer }, ends_at: { type: integer } } } } } }
      responses: { "200": { description: "{game}" } }
    delete:
      operationId: gamesSaleEnd
      summary: End the sale.
      x-auth: developer
      x-cli: games sale-end
      parameters: [{ name: game, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: "{game}" } }

  /v1/games/{game}/builds:
    get:
      operationId: buildsList
      summary: A game's uploaded builds.
      x-auth: developer
      x-cli: builds list
      parameters: [{ name: game, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: "{builds}" } }
    post:
      operationId: buildsUpload
      summary: Upload a build (the request body is the file).
      x-auth: developer
      x-cli: builds upload
      x-body: binary
      parameters:
        - { name: game, in: path, required: true, schema: { type: string } }
        - { name: platform, in: query, required: true, schema: { type: string } }
        - { name: version, in: query, required: true, schema: { type: string } }
        - { name: channel, in: query, schema: { type: string } }
        - { name: filename, in: query, schema: { type: string } }
      responses: { "200": { description: "{build}" } }

  /v1/games/{game}/builds/uploads:
    post:
      operationId: buildsUploadStart
      summary: Start a direct upload; returns a signed URL to PUT the file to storage (no size cap). `partii builds upload` uses this when the platform has R2.
      x-auth: developer
      x-cli: builds upload-start
      parameters: [{ name: game, in: path, required: true, schema: { type: string } }]
      requestBody: { content: { application/json: { schema: { type: object, required: [platform, version, size, sha256], properties: { platform: { type: string }, version: { type: string }, channel: { type: string }, filename: { type: string }, size: { type: integer }, sha256: { type: string, description: "hex; storage rejects bytes that don't match" } } } } } }
      responses: { "200": { description: "{upload: {id, url, method, headers, expires_at}}" } }

  /v1/games/{game}/builds/uploads/{upload}:
    post:
      operationId: buildsUploadFinish
      summary: Record a build after its direct upload (checks the stored size).
      x-auth: developer
      x-cli: builds upload-finish
      parameters:
        - { name: game, in: path, required: true, schema: { type: string } }
        - { name: upload, in: path, required: true, schema: { type: string } }
      requestBody: { content: { application/json: { schema: { type: object, required: [platform, version, size, sha256], properties: { platform: { type: string }, version: { type: string }, channel: { type: string }, filename: { type: string }, size: { type: integer }, sha256: { type: string } } } } } }
      responses: { "200": { description: "{build}" } }

  /v1/games/{game}/codes:
    get:
      operationId: codesList
      summary: The game's redeemable keys.
      x-auth: developer
      x-cli: codes list
      parameters: [{ name: game, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: "{codes}" } }
    post:
      operationId: codesCreate
      summary: Make redeemable keys (for press, bundles, friends).
      x-auth: developer
      x-cli: codes create
      parameters: [{ name: game, in: path, required: true, schema: { type: string } }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { count: { type: integer }, note: { type: string } } } } } }
      responses: { "200": { description: "{codes}" } }

  /v1/games/{game}/entitlements:
    get:
      operationId: entitlementsList
      summary: Who owns the game, and how.
      x-auth: developer
      x-cli: entitlements list
      parameters: [{ name: game, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: "{entitlements}" } }
    post:
      operationId: entitlementsGrant
      summary: Give a player the game (support, gifts, testers).
      x-auth: developer
      x-cli: entitlements grant
      parameters: [{ name: game, in: path, required: true, schema: { type: string } }]
      requestBody: { content: { application/json: { schema: { type: object, required: [player], properties: { player: { type: string }, note: { type: string } } } } } }
      responses: { "200": { description: "{entitlement}" } }
  /v1/games/{game}/entitlements/{player}:
    delete:
      operationId: entitlementsRevoke
      summary: Take the game back from a player (refunds).
      x-auth: developer
      x-cli: entitlements revoke
      parameters:
        - { name: game, in: path, required: true, schema: { type: string } }
        - { name: player, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: "{revoked}" } }

  /v1/games/{game}/sales:
    get:
      operationId: salesList
      summary: Purchases of the game.
      x-auth: developer
      x-cli: sales
      parameters: [{ name: game, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: "{purchases, totals}" } }

  /v1/games/{game}/content:
    post:
      operationId: contentPush
      summary: Publish a live content version (levels, data, scripts) to a channel.
      x-auth: developer
      x-cli: content push
      parameters: [{ name: game, in: path, required: true, schema: { type: string } }]
      requestBody: { content: { application/json: { schema: { type: object, required: [version, files], properties: { version: { type: string }, channel: { type: string }, files: { type: object, additionalProperties: { type: string, description: "base64" } } } } } } }
      responses: { "200": { description: "{manifest}" } }

  /v1/test/players:
    post:
      operationId: testPlayersCreate
      summary: Make a test player and its token (for your own games' tests).
      x-auth: developer
      x-cli: test players create
      requestBody: { content: { application/json: { schema: { type: object, properties: { name: { type: string } } } } } }
      responses: { "200": { description: "{player, player_token}" } }
  /v1/test/purchases:
    post:
      operationId: testPurchase
      summary: Buy a game as a test player through Stripe test mode (or the fake store in dev).
      x-auth: developer
      x-cli: test purchase
      requestBody: { content: { application/json: { schema: { type: object, required: [game, player], properties: { game: { type: string }, player: { type: string } } } } } }
      responses: { "200": { description: "{purchase, entitlement}" } }

  /v1/players/guest:
    post:
      operationId: playersGuest
      summary: Sign in as a guest (one per device; no form to fill).
      x-auth: key
      x-cli: player guest
      requestBody: { content: { application/json: { schema: { type: object, required: [device_id], properties: { device_id: { type: string }, display_name: { type: string } } } } } }
      responses: { "200": { description: "{player, player_token}" } }
  /v1/players/email/start:
    post:
      operationId: playersEmailStart
      summary: Send a sign-in code to an email address.
      x-auth: key
      x-cli: player email-start
      requestBody: { content: { application/json: { schema: { type: object, required: [email], properties: { email: { type: string } } } } } }
      responses: { "200": { description: "{sent} (dev: also {code})" } }
  /v1/players/login:
    post:
      operationId: playersLogin
      summary: Sign in with a provider (email code, apple, google, discord, steam, fake in dev). With a guest token, the guest is merged in.
      x-auth: key
      x-cli: player login
      requestBody: { content: { application/json: { schema: { type: object, required: [provider], properties: { provider: { type: string }, email: { type: string }, code: { type: string }, id_token: { type: string }, ticket: { type: string }, identity: { type: string, description: "Steam: the GetAuthTicketForWebApi identity" }, app_id: { type: string, description: "Steam: the app that issued the ticket" }, game: { type: string, description: "Steam: whose Steam key checks the ticket (default: the key's project's only game)" }, subject: { type: string } } } } } }
      responses: { "200": { description: "{player, player_token, merged}" } }
  /v1/players/me:
    get:
      operationId: playersMe
      summary: The signed-in player.
      x-auth: player
      x-cli: player me
      responses: { "200": { description: "{player}" } }
    patch:
      operationId: playersUpdate
      summary: Change the display name.
      x-auth: player
      x-cli: player rename
      requestBody: { content: { application/json: { schema: { type: object, properties: { display_name: { type: string } } } } } }
      responses: { "200": { description: "{player}" } }
    delete:
      operationId: playersDelete
      summary: Delete the account and its data (saves, identities). Purchases are kept as anonymous records.
      x-auth: player
      x-cli: player delete
      responses: { "200": { description: "{deleted}" } }
  /v1/players/me/entitlements:
    get:
      operationId: playersEntitlements
      summary: What the player owns, plus a signed copy a game can trust offline for a week.
      x-auth: player
      x-cli: player entitlements
      parameters: [{ name: game, in: query, schema: { type: string } }]
      responses: { "200": { description: "{entitlements, signed}" } }
  /v1/players/me/redeem:
    post:
      operationId: playersRedeem
      summary: Redeem a key.
      x-auth: player
      x-cli: player redeem
      requestBody: { content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string } } } } } }
      responses: { "200": { description: "{entitlement}" } }
  /v1/players/me/receipts:
    post:
      operationId: playersReceipt
      summary: Record a purchase made in a platform store (App Store, Google Play, Steam) after verifying it.
      x-auth: player
      x-cli: player receipt
      requestBody: { content: { application/json: { schema: { type: object, required: [store, game], properties: { store: { type: string, enum: [appstore, play, steam] }, game: { type: string }, transaction: { type: string }, purchase_token: { type: string }, product_id: { type: string }, steam_id: { type: string }, ticket: { type: string } } } } } }
      responses: { "200": { description: "{entitlement}" } }

  /v1/saves/{game}:
    get:
      operationId: savesList
      summary: The player's save slots for a game.
      x-auth: player
      x-cli: saves list
      parameters: [{ name: game, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: "{saves}" } }
  /v1/saves/{game}/{slot}:
    get:
      operationId: savesGet
      summary: One save slot.
      x-auth: player
      x-cli: saves get
      parameters:
        - { name: game, in: path, required: true, schema: { type: string } }
        - { name: slot, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: "{save}" } }
    put:
      operationId: savesPut
      summary: Write a save. Pass the rev you read; a newer save elsewhere returns 409 with both copies so the game can merge.
      x-auth: player
      x-cli: saves put
      parameters:
        - { name: game, in: path, required: true, schema: { type: string } }
        - { name: slot, in: path, required: true, schema: { type: string } }
      requestBody: { content: { application/json: { schema: { type: object, required: [data], properties: { base_rev: { type: integer }, data: {} } } } } }
      responses: { "200": { description: "{save}" }, "409": { description: "{error, theirs, yours}" } }
  /v1/saves/{game}/{slot}/history:
    get:
      operationId: savesHistory
      summary: Earlier revisions of a save (backups).
      x-auth: player
      x-cli: saves history
      parameters:
        - { name: game, in: path, required: true, schema: { type: string } }
        - { name: slot, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: "{revisions}" } }
  /v1/saves/{game}/{slot}/restore:
    post:
      operationId: savesRestore
      summary: Make an earlier revision current again.
      x-auth: player
      x-cli: saves restore
      parameters:
        - { name: game, in: path, required: true, schema: { type: string } }
        - { name: slot, in: path, required: true, schema: { type: string } }
      requestBody: { content: { application/json: { schema: { type: object, required: [rev], properties: { rev: { type: integer } } } } } }
      responses: { "200": { description: "{save}" } }

  /v1/content/{game}/manifest:
    get:
      operationId: contentManifest
      summary: The current live content for a channel.
      x-auth: key
      x-cli: content manifest
      parameters:
        - { name: game, in: path, required: true, schema: { type: string } }
        - { name: channel, in: query, schema: { type: string } }
      responses: { "200": { description: "{manifest}" } }
  /v1/content/{game}/files/{sha}:
    get:
      operationId: contentFile
      summary: One content file, addressed by its hash (cache forever).
      x-auth: key
      x-cli: content file
      x-response: binary
      parameters:
        - { name: game, in: path, required: true, schema: { type: string } }
        - { name: sha, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: "the file" } }

  # ── Player content (UGC): levels, worlds, replays. docs/GUIDE.md §3 ──
  /v1/games/{game}/ugc/uploads:
    post:
      operationId: ugcUploadStart
      summary: Start uploading a file or thumbnail by its hash. Returns where to PUT the bytes, or exists=true when that hash is already stored.
      x-auth: player
      x-cli: ugc upload-start
      parameters: [{ name: game, in: path, required: true, schema: { type: string } }]
      requestBody: { content: { application/json: { schema: { type: object, required: [size, sha256], properties: { kind: { type: string, enum: [file, thumbnail] }, size: { type: integer }, sha256: { type: string } } } } } }
      responses: { "200": { description: "{exists} or {upload: {url, method, headers, expires_at}}" } }
  /v1/games/{game}/ugc/blobs/{sha256}:
    get:
      operationId: ugcBlob
      summary: A stored file or thumbnail, by its hash (cache forever). The download_url and thumbnail_url in item views point here.
      x-auth: public
      x-cli: ugc blob
      x-response: binary
      parameters:
        - { name: game, in: path, required: true, schema: { type: string } }
        - { name: sha256, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: "the bytes" } }
    put:
      operationId: ugcBlobPut
      summary: Upload the bytes to a url from ugcUploadStart when the platform has no direct uploads (the url carries a signed ticket).
      x-auth: public
      x-body: binary
      parameters:
        - { name: game, in: path, required: true, schema: { type: string } }
        - { name: sha256, in: path, required: true, schema: { type: string } }
        - { name: ticket, in: query, required: true, schema: { type: string } }
      responses: { "200": { description: "{stored}" } }
  /v1/games/{game}/ugc:
    get:
      operationId: ugcList
      summary: Browse and search public items. sort is new, top or played; tags is comma-separated (all must match); pass next_cursor as cursor for the next page.
      x-auth: key
      x-cli: ugc list
      parameters:
        - { name: game, in: path, required: true, schema: { type: string } }
        - { name: kind, in: query, schema: { type: string } }
        - { name: tags, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
        - { name: author, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: cursor, in: query, schema: { type: string } }
      responses: { "200": { description: "{items, next_cursor}" } }
    post:
      operationId: ugcPublish
      summary: Publish an item from uploaded files (signed-in players, not guests). refs lists the hashes a World pins.
      x-auth: player
      x-cli: ugc publish
      parameters: [{ name: game, in: path, required: true, schema: { type: string } }]
      requestBody: { content: { application/json: { schema: { type: object, required: [kind, title, sha256, client_version], properties: { kind: { type: string, enum: [level, world, replay] }, title: { type: string }, description: { type: string }, tags: { type: array }, visibility: { type: string, enum: [public, unlisted] }, sha256: { type: string }, client_version: { type: string }, thumbnail_sha256: { type: string }, refs: { type: array }, notes: { type: string } } } } } }
      responses: { "200": { description: "{item}" } }
  /v1/games/{game}/ugc/code/{code}:
    get:
      operationId: ugcByCode
      summary: The item with this share code (works for unlisted items).
      x-auth: key
      x-cli: ugc code
      parameters:
        - { name: game, in: path, required: true, schema: { type: string } }
        - { name: code, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: "{item}" } }
  /v1/games/{game}/ugc/hash/{sha256}:
    get:
      operationId: ugcByHash
      summary: The items and versions stored under this hash (a World's pinned Levels).
      x-auth: key
      x-cli: ugc hash
      parameters:
        - { name: game, in: path, required: true, schema: { type: string } }
        - { name: sha256, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: "{sha256, size, download_url, versions}" } }
  /v1/games/{game}/ugc/reports:
    get:
      operationId: ugcReports
      summary: Reported items of your game, most reported first (unresolved reports only).
      x-auth: developer
      x-cli: ugc reports
      parameters: [{ name: game, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: "{items}" } }
  /v1/ugc/{id}:
    get:
      operationId: ugcGet
      summary: One item with all its versions. With a player token, my_vote is included.
      x-auth: key
      x-cli: ugc get
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: "{item}" } }
    patch:
      operationId: ugcUpdate
      summary: Change an item's title, description, tags, visibility or thumbnail (author only).
      x-auth: player
      x-cli: ugc update
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { title: { type: string }, description: { type: string }, tags: { type: array }, visibility: { type: string, enum: [public, unlisted] }, thumbnail_sha256: { type: string } } } } } }
      responses: { "200": { description: "{item}" } }
    delete:
      operationId: ugcDelete
      summary: Unpublish an item (author only). Its files stay downloadable by hash while Worlds pin them.
      x-auth: player
      x-cli: ugc delete
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: "{deleted}" } }
  /v1/ugc/{id}/versions:
    post:
      operationId: ugcVersion
      summary: Publish a new version of an item (author only). Old versions stay downloadable by hash.
      x-auth: player
      x-cli: ugc version
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { content: { application/json: { schema: { type: object, required: [sha256, client_version], properties: { sha256: { type: string }, client_version: { type: string }, notes: { type: string }, refs: { type: array } } } } } }
      responses: { "200": { description: "{item}" } }
  /v1/ugc/{id}/vote:
    put:
      operationId: ugcVote
      summary: Vote an item up (1), down (-1) or clear your vote (0). One vote per player per item.
      x-auth: player
      x-cli: ugc vote
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { content: { application/json: { schema: { type: object, required: [value], properties: { value: { type: integer, enum: [1, 0, -1] } } } } } }
      responses: { "200": { description: "{votes, my_vote}" } }
  /v1/ugc/{id}/plays:
    post:
      operationId: ugcPlay
      summary: Count a play (fire and forget). plays counts players, so repeats by the same player don't add.
      x-auth: player
      x-cli: ugc play
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: "{counted}" } }
  /v1/ugc/{id}/report:
    post:
      operationId: ugcReport
      summary: Report an item to the game's moderators.
      x-auth: player
      x-cli: ugc report
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string } } } } } }
      responses: { "200": { description: "{reported}" } }
  /v1/ugc/{id}/moderate:
    post:
      operationId: ugcModerate
      summary: Hide an item (and its files) or bring it back, as the game's developer. Resolves its reports.
      x-auth: developer
      x-cli: ugc moderate
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { content: { application/json: { schema: { type: object, required: [action], properties: { action: { type: string, enum: [hide, unhide] }, reason: { type: string } } } } } }
      responses: { "200": { description: "{item}" } }
  /v1/admin/ugc/{id}/moderate:
    post:
      operationId: adminUgcModerate
      summary: Hide an item (and its files) or bring it back, as a platform operator (takedowns). Admin or moderator token.
      x-auth: admin
      x-cli: admin ugc moderate
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { content: { application/json: { schema: { type: object, required: [action], properties: { action: { type: string, enum: [hide, unhide] }, reason: { type: string } } } } } }
      responses: { "200": { description: "{item}" } }
  /v1/admin/ugc/review:
    get:
      operationId: adminUgcReview
      summary: The moderation queue, oldest first. Every new item, new version, edit and report is an entry; pending only unless all=1. Each has the item, file_url and thumbnail_url (they work while hidden) and open reports. Admin or moderator token.
      x-auth: admin
      x-cli: admin ugc review
      parameters:
        - { name: after, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: all, in: query, schema: { type: string } }
      responses: { "200": { description: "{entries, pending, last_seq}" } }
  /v1/admin/ugc/review/{seq}:
    post:
      operationId: adminUgcReviewDecide
      summary: "Decide an entry: ok (visible; undoes an automatic hide) or hide (reason required: the rule it breaks, which the author sees). Settles every open entry and report for that item. Admin or moderator token."
      x-auth: admin
      x-cli: admin ugc decide
      parameters: [{ name: seq, in: path, required: true, schema: { type: integer } }]
      requestBody: { content: { application/json: { schema: { type: object, required: [verdict], properties: { verdict: { type: string, enum: [ok, hide] }, reason: { type: string } } } } } }
      responses: { "200": { description: "{item}" } }
  /v1/admin/ugc/blobs/{game}/{sha256}:
    get:
      operationId: adminUgcBlob
      summary: A player content file or thumbnail, hidden or not (for review). Admin or moderator token.
      x-auth: admin
      x-cli: admin ugc blob
      x-response: binary
      parameters:
        - { name: game, in: path, required: true, schema: { type: string } }
        - { name: sha256, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: "the bytes" } }
  /v1/players/me/ugc:
    get:
      operationId: ugcMine
      summary: The player's own items, hidden ones included (unpublished ones are not).
      x-auth: player
      x-cli: ugc mine
      parameters: [{ name: game, in: query, schema: { type: string } }]
      responses: { "200": { description: "{items}" } }

  # ── Per-game secrets (src/api/secrets.ts) and Steam sign-in (src/api/steam.ts) ──
  /v1/games/{game}/secrets:
    get:
      operationId: secretsList
      summary: The game's secrets and config. Secret values are never shown (only set, last 4, updated); config values are.
      x-auth: developer
      x-cli: secrets list
      parameters: [{ name: game, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: "{secrets}" } }
  /v1/games/{game}/secrets/{name}:
    put:
      operationId: secretsSet
      summary: Store or replace a secret or config value (steam.web_api_key, steam.app_ids). From the CLI, --value - reads it from stdin.
      x-auth: developer
      x-cli: secrets set
      parameters:
        - { name: game, in: path, required: true, schema: { type: string } }
        - { name: name, in: path, required: true, schema: { type: string } }
      requestBody: { content: { application/json: { schema: { type: object, required: [value], properties: { value: { type: string } } } } } }
      responses: { "200": { description: "{secret}" } }
    delete:
      operationId: secretsDelete
      summary: Delete a secret or config value.
      x-auth: developer
      x-cli: secrets delete
      parameters:
        - { name: game, in: path, required: true, schema: { type: string } }
        - { name: name, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: "{deleted}" } }
  /v1/games/{game}/web/deploys:
    get:
      operationId: webDeploysList
      summary: The game's site (https://<game>.partii.games) and its deploys, newest first, with which is live and each one's preview_url.
      x-auth: developer
      x-cli: web list
      parameters: [{ name: game, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: "{url, live, deploys}" } }
    post:
      operationId: webDeployStart
      summary: "Start a deploy: files is {path: {sha256, size}} for the whole folder (index.html at the top). Returns the hashes the platform doesn't have yet (missing). Options: spa (unknown paths serve the nearest index.html), isolated (cross-origin isolation for threaded wasm), note. `partii web deploy <game> <dir>` does every step."
      x-auth: developer
      x-cli: web deploy-start
      parameters: [{ name: game, in: path, required: true, schema: { type: string } }]
      requestBody: { content: { application/json: { schema: { type: object, required: [files], properties: { files: { type: object }, spa: { type: boolean }, isolated: { type: boolean }, note: { type: string } } } } } }
      responses: { "200": { description: "{deploy, missing}" } }
  /v1/games/{game}/web/deploys/{deploy}/uploads:
    post:
      operationId: webDeployUploads
      summary: Where to PUT missing files (up to 100 hashes per call); each upload URL checks the bytes against the hash.
      x-auth: developer
      x-cli: web deploy-uploads
      parameters:
        - { name: game, in: path, required: true, schema: { type: string } }
        - { name: deploy, in: path, required: true, schema: { type: string } }
      requestBody: { content: { application/json: { schema: { type: object, required: [sha256], properties: { sha256: { type: array, items: { type: string } } } } } } }
      responses: { "200": { description: "{uploads}" } }
  /v1/games/{game}/web/deploys/{deploy}/finish:
    post:
      operationId: webDeployFinish
      summary: Check the uploads (a batch per call; call again while done is false) and, unless activate is false, make the deploy live.
      x-auth: developer
      x-cli: web deploy-finish
      parameters:
        - { name: game, in: path, required: true, schema: { type: string } }
        - { name: deploy, in: path, required: true, schema: { type: string } }
      requestBody: { content: { application/json: { schema: { type: object, properties: { activate: { type: boolean } } } } } }
      responses: { "200": { description: "{done, deploy, url} or {done: false, remaining, not_uploaded}" } }
  /v1/games/{game}/web/deploys/{deploy}/activate:
    post:
      operationId: webActivate
      summary: Make a finished deploy the live site (a rollback, or going live after a preview).
      x-auth: developer
      x-cli: web activate
      parameters:
        - { name: game, in: path, required: true, schema: { type: string } }
        - { name: deploy, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: "{live, url}" } }
  /v1/games/{game}/web:
    delete:
      operationId: webTakeDown
      summary: Take the game's site offline (deploys are kept; activate one to bring it back).
      x-auth: developer
      x-cli: web take-down
      parameters: [{ name: game, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: "{taken_down}" } }
  /v1/games/{game}/web/blobs/{sha256}:
    put:
      operationId: webBlobPut
      summary: Upload one file to a URL from webDeployUploads when the platform has no direct uploads (the URL carries a signed ticket).
      x-auth: public
      x-body: binary
      parameters:
        - { name: game, in: path, required: true, schema: { type: string } }
        - { name: sha256, in: path, required: true, schema: { type: string } }
        - { name: ticket, in: query, required: true, schema: { type: string } }
      responses: { "200": { description: "{stored}" } }
  # ── Analytics: events, sessions, retention, error reports (src/api/analytics.ts). docs/GUIDE.md §8 ──
  /v1/games/{game}/events:
    post:
      operationId: analyticsIngest
      summary: "Record a batch of events (up to 100) from one device. device is the install id; platform, version, build and owned describe what it runs. Each event is {name, at (unix ms), session, props (flat: short strings, numbers, bools; 1 KB)}; events that don't fit are dropped and counted. session_end {secs} closes a session. A player token is optional. The account crate (track) sends these for you."
      x-auth: key
      x-cli: analytics send
      parameters: [{ name: game, in: path, required: true, schema: { type: string } }]
      requestBody: { content: { application/json: { schema: { type: object, required: [device, events], properties: { device: { type: string }, platform: { type: string }, version: { type: string }, build: { type: string }, owned: { type: boolean }, events: { type: array, items: { type: object, required: [name], properties: { name: { type: string }, at: { type: integer }, session: { type: string }, props: { type: object } } } } } } } } }
      responses: { "200": { description: "{accepted, dropped}" } }
    get:
      operationId: analyticsEvents
      summary: "Event counts. No name: every event name with counts and devices. A name: counts per day. A name and by: counts per value of that prop (a funnel, e.g. level_complete by mission) or of platform, version, build or owned. Filters: days (default 30), platform, version, owned."
      x-auth: developer
      x-cli: analytics events
      parameters:
        - { name: game, in: path, required: true, schema: { type: string } }
        - { name: name, in: query, schema: { type: string } }
        - { name: by, in: query, schema: { type: string } }
        - { name: days, in: query, schema: { type: integer } }
        - { name: platform, in: query, schema: { type: string } }
        - { name: version, in: query, schema: { type: string } }
        - { name: owned, in: query, schema: { type: string } }
      responses: { "200": { description: "{names} or {name, total, days} or {name, by, total, values}" } }
  /v1/games/{game}/analytics:
    get:
      operationId: analyticsSummary
      summary: "Players for the last `days` (default 30): DAU per day with new and returning, WAU, MAU, sessions and median session length, D1/D7/D30 retention, and players by platform, version and country. Filters: platform, version, owned (true: full game, false: demo)."
      x-auth: developer
      x-cli: analytics summary
      parameters:
        - { name: game, in: path, required: true, schema: { type: string } }
        - { name: days, in: query, schema: { type: integer } }
        - { name: platform, in: query, schema: { type: string } }
        - { name: version, in: query, schema: { type: string } }
        - { name: owned, in: query, schema: { type: string } }
      responses: { "200": { description: "{players, dau, wau, mau, sessions, median_session_secs, retention, days, platforms, versions, countries}" } }
  /v1/games/{game}/errors:
    post:
      operationId: errorsIngest
      summary: "Report errors (up to 20) from one device: {device, platform, version, build, errors: [{kind: panic|error|warning, message, backtrace, context (flat, 2 KB), session, at}]}. Reports group by a fingerprint of the kind, the message (numbers and quoted text blanked) and the top 3 game frames; send fingerprint to group them yourself. A fixed group that's reported again reopens."
      x-auth: key
      x-cli: errors send
      parameters: [{ name: game, in: path, required: true, schema: { type: string } }]
      requestBody: { content: { application/json: { schema: { type: object, required: [device, errors], properties: { device: { type: string }, platform: { type: string }, version: { type: string }, build: { type: string }, owned: { type: boolean }, errors: { type: array, items: { type: object, required: [kind, message], properties: { kind: { type: string, enum: [panic, error, warning] }, message: { type: string }, backtrace: { type: string }, context: { type: object }, session: { type: string }, at: { type: integer }, fingerprint: { type: string } } } } } } } } }
      responses: { "200": { description: "{groups}" } }
    get:
      operationId: errorsList
      summary: "Error groups, newest first (sort=count: most reported): first and last seen, count, devices, versions and platforms affected, status. status is open (default), fixed, ignored or all; filter by version, platform, kind."
      x-auth: developer
      x-cli: errors list
      parameters:
        - { name: game, in: path, required: true, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: version, in: query, schema: { type: string } }
        - { name: platform, in: query, schema: { type: string } }
        - { name: kind, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string } }
      responses: { "200": { description: "{groups}" } }
  /v1/games/{game}/errors/{fingerprint}:
    get:
      operationId: errorsGet
      summary: One error group and its latest reports (backtrace, context, version, platform, session).
      x-auth: developer
      x-cli: errors get
      parameters:
        - { name: game, in: path, required: true, schema: { type: string } }
        - { name: fingerprint, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: "{group, samples}" } }
    post:
      operationId: errorsUpdate
      summary: Mark an error group open, fixed or ignored. A fixed group reopens when it's reported again.
      x-auth: developer
      x-cli: errors mark
      parameters:
        - { name: game, in: path, required: true, schema: { type: string } }
        - { name: fingerprint, in: path, required: true, schema: { type: string } }
      requestBody: { content: { application/json: { schema: { type: object, required: [status], properties: { status: { type: string, enum: [open, fixed, ignored] } } } } } }
      responses: { "200": { description: "{fingerprint, status}" } }
  # ── Leaderboards (src/api/leaderboards.ts). docs/GUIDE.md §3 ──
  /v1/games/{game}/leaderboards:
    get:
      operationId: leaderboardsList
      summary: The game's boards, which way each sorts, and how many scores were submitted.
      x-auth: developer
      x-cli: leaderboards list
      parameters: [{ name: game, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: "{boards}" } }
  /v1/games/{game}/leaderboards/{board}:
    get:
      operationId: leaderboardGet
      summary: "The top players on a board (period daily, weekly or all; limit up to 100, default 10): {rank, player_id, display_name, score, meta, achieved_at}. With a player token, me is that player's best on the board, with its rank (null if none). Days and weeks are UTC; weeks start Monday; resets_at says when the period ends."
      x-auth: key
      x-cli: leaderboards get
      parameters:
        - { name: game, in: path, required: true, schema: { type: string } }
        - { name: board, in: path, required: true, schema: { type: string } }
        - { name: period, in: query, schema: { type: string, enum: [daily, weekly, all] } }
        - { name: limit, in: query, schema: { type: integer } }
      responses: { "200": { description: "{board, period, higher_is_better, resets_at, players, total_plays, entries, me}" } }
    post:
      operationId: leaderboardSubmit
      summary: "Submit a score, once per run. Each board keeps the player's best (a worse score only counts as a play) for today, this week and all time. meta is flat (short strings, numbers, bools; 1 KB) and is kept with the best. The board is made on the first submit, higher-is-better. Returns best per period with rank and improved."
      x-auth: player
      x-cli: leaderboards submit
      parameters:
        - { name: game, in: path, required: true, schema: { type: string } }
        - { name: board, in: path, required: true, schema: { type: string } }
      requestBody: { content: { application/json: { schema: { type: object, required: [score], properties: { score: { type: number }, meta: { type: object } } } } } }
      responses: { "200": { description: "{board, score, best: {daily, weekly, all}}" } }
  /v1/games/{game}/leaderboards/{board}/config:
    put:
      operationId: leaderboardConfig
      summary: "Set which way a board sorts: higher_is_better false for times (the lowest wins). Set it before players submit."
      x-auth: developer
      x-cli: leaderboards config
      parameters:
        - { name: game, in: path, required: true, schema: { type: string } }
        - { name: board, in: path, required: true, schema: { type: string } }
      requestBody: { content: { application/json: { schema: { type: object, required: [higher_is_better], properties: { higher_is_better: { type: boolean } } } } } }
      responses: { "200": { description: "{board, higher_is_better}" } }
  /v1/games/{game}/leaderboards/{board}/players/{player}:
    delete:
      operationId: leaderboardRemovePlayer
      summary: Remove a player's scores from a board (every period), e.g. a cheater's.
      x-auth: developer
      x-cli: leaderboards remove
      parameters:
        - { name: game, in: path, required: true, schema: { type: string } }
        - { name: board, in: path, required: true, schema: { type: string } }
        - { name: player, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: "{removed}" } }
  /v1/games/{game}/theme:
    get:
      operationId: themeGet
      summary: The game's look on partii's pages (the phone controller), with file names replaced by URLs. Public; theme is null when none is set.
      x-auth: public
      x-cli: theme get
      parameters:
        - { name: game, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: "{theme, files, updated_at}" } }
    put:
      operationId: themeSet
      summary: "Set the game's theme (replaces it): name, colors {role: #hex}, fonts {heading, body} (an uploaded font file or a font-family list), radius, border, lip, caps, letter_spacing, background_image, logo. Upload files first. From the CLI: --body @theme.json. See docs/CONTROLLER.md."
      x-auth: developer
      x-cli: theme set
      parameters:
        - { name: game, in: path, required: true, schema: { type: string } }
      requestBody: { content: { application/json: { schema: { type: object } } } }
      responses: { "200": { description: "{theme, files, updated_at}" } }
    delete:
      operationId: themeDelete
      summary: Remove the game's theme and its files (pages go back to partii's look).
      x-auth: developer
      x-cli: theme delete
      parameters:
        - { name: game, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: "{deleted}" } }
  /v1/games/{game}/theme/uploads/{name}:
    put:
      operationId: themeFilePut
      summary: Upload or replace a theme file (woff2, woff, ttf, otf, png, webp, jpg; up to 1 MB, 12 files, 4 MB in all). The theme refers to it by name.
      x-auth: developer
      x-body: binary
      x-cli: theme file
      parameters:
        - { name: game, in: path, required: true, schema: { type: string } }
        - { name: name, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: "{file}" } }
    delete:
      operationId: themeFileDelete
      summary: Delete a theme file the theme no longer uses.
      x-auth: developer
      x-cli: theme file-delete
      parameters:
        - { name: game, in: path, required: true, schema: { type: string } }
        - { name: name, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: "{deleted}" } }
  /v1/games/{game}/theme/files/{sha256}:
    get:
      operationId: themeFile
      summary: A theme file by its hash (cache forever). The URLs in themeGet point here.
      x-auth: public
      x-response: binary
      parameters:
        - { name: game, in: path, required: true, schema: { type: string } }
        - { name: sha256, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: "the bytes" } }
  /v1/players/steam/openid/start:
    post:
      operationId: steamOpenidStart
      summary: Start "Sign in through Steam" in the browser (needs no Steam key). Open url, then poll. Send the guest's player token too to merge the guest.
      x-auth: key
      x-cli: player steam-start
      requestBody: { content: { application/json: { schema: { type: object, properties: { game: { type: string } } } } } }
      responses: { "200": { description: "{url, poll, expires_at}" } }
  /v1/players/steam/openid/poll:
    post:
      operationId: steamOpenidPoll
      summary: Poll a browser Steam sign-in. status is pending, done (with player and player_token, once), expired or used.
      x-auth: key
      x-cli: player steam-poll
      requestBody: { content: { application/json: { schema: { type: object, required: [poll], properties: { poll: { type: string } } } } } }
      responses: { "200": { description: "{status, player?, player_token?, merged?}" } }
  /v1/players/steam/openid/return:
    get:
      operationId: steamOpenidReturn
      summary: Where Steam sends the browser back (a page that says to return to the game).
      x-auth: public
      x-response: binary
      parameters: [{ name: state, in: query, required: true, schema: { type: string } }]
      responses: { "200": { description: "an HTML page" } }

  /v1/store/games:
    get:
      operationId: storeGames
      summary: "Every published game. play_url is where to play it in the browser: the site (https://<game>.partii.games) of a game whose platforms include web."
      x-auth: public
      x-cli: store list
      responses: { "200": { description: "{games}" } }
  /v1/store/games/{game}:
    get:
      operationId: storeGame
      summary: A published game's store page, with its stable builds; play_url as in storeGames.
      x-auth: public
      x-cli: store get
      parameters: [{ name: game, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: "{game, builds}" } }
  /v1/store/games/{game}/checkout:
    post:
      operationId: storeCheckout
      summary: Start a Stripe Checkout for the game; returns the URL to send the buyer to.
      x-auth: player
      x-cli: store checkout
      parameters: [{ name: game, in: path, required: true, schema: { type: string } }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { success_url: { type: string }, cancel_url: { type: string } } } } } }
      responses: { "200": { description: "{url, session}" } }
  /v1/store/games/{game}/download/{platform}:
    get:
      operationId: storeDownload
      summary: Download the current build for a platform (owners, or anyone when the game has a demo).
      x-auth: player
      x-cli: store download
      x-response: binary
      parameters:
        - { name: game, in: path, required: true, schema: { type: string } }
        - { name: platform, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: "the build" } }
  /v1/store/library:
    get:
      operationId: storeLibrary
      summary: The player's games.
      x-auth: player
      x-cli: store library
      responses: { "200": { description: "{games}" } }

  /v1/webhooks/stripe:
    post:
      operationId: webhookStripe
      summary: Stripe events (checkout completed, payment succeeded, refunds).
      x-auth: stripe
      responses: { "200": { description: "{received}" } }
