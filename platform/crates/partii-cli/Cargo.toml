[package]
name = "partii-cli"
description = "The partii command line: everything a developer (or an agent) does on the platform."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "partii"
path = "src/main.rs"

[dependencies]
partii-engine = { path = "../partii-engine" }
serde.workspace = true
serde_json.workspace = true
clap = { version = "4.6", features = ["derive", "env"] }
