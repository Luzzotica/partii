[package]
name = "partii-engine"
description = "The partii connection engine: sessions, rooms, signaling, WebRTC and relay paths, recovery."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[features]
default = ["native"]
native = ["dep:tokio", "dep:tokio-tungstenite", "dep:webrtc", "dep:async-channel", "dep:bytes", "dep:async-trait", "dep:futures-util"]

[dependencies.tokio]
workspace = true
optional = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"], optional = true }
webrtc = { package = "partii-webrtc", path = "../../vendor/webrtc", optional = true }
async-channel = { version = "2", optional = true }
bytes = { version = "1", optional = true }
async-trait = { version = "0.1", optional = true }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"], optional = true }
log = "0.4"
getrandom = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
getrandom = { version = "0.3", features = ["wasm_js"] }
web-sys = { version = "0.3", features = [
  "Window", "WebSocket", "MessageEvent", "BinaryType", "CloseEvent",
  "RtcPeerConnection", "RtcConfiguration", "RtcIceTransportPolicy", "RtcDataChannel", "RtcDataChannelInit",
  "RtcDataChannelEvent", "RtcDataChannelState", "RtcDataChannelType", "RtcSessionDescriptionInit", "RtcSdpType",
  "RtcIceCandidate", "RtcIceCandidateInit", "RtcPeerConnectionIceEvent", "RtcPeerConnectionState",
] }
